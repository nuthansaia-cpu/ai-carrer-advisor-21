# Netlify configuration for the standalone HTML frontend
[build]
  base    = "frontend"
  publish = "."

# Redirect all requests to index.html (SPA behaviour)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
